# Routes defined in GatewayConfig.java

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: account-service
              uri: http://localhost:8080
              predicates:
                - Path=/account/**
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/customer/**
            - id: Auth-service
              uri: http://localhost:8090
              predicates:
                - Path=/auth/**